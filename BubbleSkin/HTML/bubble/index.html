<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>[% "BUBBLE_SKIN" | string %]</title>
  <link rel="stylesheet" href="[% webroot %]html/css/display.css?v=0.1.5">
</head>
<body data-state="loading">

<main id="np" class="np">
  <section class="np-cover">
    <img id="cover" src="[% webroot %]html/images/cover-placeholder.svg" alt="">
  </section>

  <section class="np-meta">
    <h1 id="title" class="np-title ticker-target"><span></span></h1>
    <div id="artist" class="np-artist ticker-target"><span></span></div>
    <div id="album" class="np-album ticker-target"><span></span></div>
    <div id="tech" class="np-tech ticker-target"><span></span></div>

    <div id="progress" class="np-progress">
      <div class="np-progress-bar"><div id="progress-fill" class="np-progress-fill"></div></div>
      <div class="np-progress-times">
        <span id="time-elapsed"></span>
        <span id="time-total"></span>
      </div>
    </div>
  </section>

  <footer class="np-status">
    <div id="coming-up" class="np-comingup">
      <span id="coming-label" class="np-coming-label"></span>
      <img id="coming-cover" class="np-coming-cover" src="" alt="">
      <div class="np-coming-meta">
        <div id="coming-title" class="np-coming-title ticker-target"><span></span></div>
        <div id="coming-artist" class="np-coming-artist ticker-target"><span></span></div>
      </div>
    </div>
    <div id="state-msg" class="np-statemsg"></div>
  </footer>
</main>

  <script src="[% webroot %]html/lib/libcometd.min.js?v=0.1.5"></script>
  <script src="[% webroot %]html/js/lms.js?v=0.1.5"></script>
  <script src="[% webroot %]html/js/realtime.js?v=0.1.5"></script>
  <script src="[% webroot %]html/js/ticker.js?v=0.1.5"></script>
  <script src="[% webroot %]html/js/display.js?v=0.1.5"></script>
  <script src="[% webroot %]html/js/boot.js?v=0.1.5"></script>
</body>
</html>
